services:
  - type: web
    name: tradenex-v2
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tradenex-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: FLASK_DEBUG
        value: "0"

  - type: cron
    name: tradenex-referral-commissions
    runtime: python
    plan: starter
    region: singapore
    schedule: "5 16 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app process-referral-commissions
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tradenex-postgres
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tradenex-v2
          envVarKey: SECRET_KEY
      - key: DEFAULT_ADMIN_PASSWORD
        fromService:
          type: web
          name: tradenex-v2
          envVarKey: DEFAULT_ADMIN_PASSWORD
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: tradenex-postgres
    databaseName: tradenex
    user: tradenex
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
