services:
  - type: web
    name: tradenex-staging-web
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tradenex-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tradenex-staging-limiter
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: FLASK_DEBUG
        value: "0"

  - type: cron
    name: tradenex-staging-referral-commissions
    runtime: python
    plan: starter
    region: singapore
    schedule: "5 16 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app process-referral-commissions
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tradenex-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tradenex-staging-limiter
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tradenex-staging-web
          envVarKey: SECRET_KEY
      - key: DEFAULT_ADMIN_PASSWORD
        fromService:
          type: web
          name: tradenex-staging-web
          envVarKey: DEFAULT_ADMIN_PASSWORD
      - key: FLASK_DEBUG
        value: "0"

  - type: keyvalue
    name: tradenex-staging-limiter
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: tradenex-staging-postgres
    databaseName: tradenex_staging
    user: tradenex_staging
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
