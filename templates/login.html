<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Log Masuk — TradeNex Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0B1629;--navy2:#111E35;--navy3:#192847;
  --gold:#D4A843;--gold2:#F0C96A;--white:#FFFFFF;
  --text-muted:#8FA3BF;--text-light:#C8D8EE;--border:#1E3050;--red:#FF5B5B;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.25rem}
.box{background:#0F1C32;border:1px solid var(--border);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:380px}
.logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:0.4rem;text-decoration:none;display:block;color:var(--white)}
.logo span{color:var(--gold)}
.subtitle{text-align:center;color:var(--text-muted);font-size:0.8rem;margin-bottom:2rem}
.label{display:block;font-size:0.78rem;font-weight:600;color:var(--text-muted);margin-bottom:0.4rem;letter-spacing:0.5px;text-transform:uppercase}
.input{width:100%;background:#162033;border:1px solid var(--border);border-radius:8px;padding:0.75rem 1rem;color:var(--white);font-size:1rem;font-family:'IBM Plex Sans',sans-serif;outline:none;transition:border-color 0.2s;margin-bottom:1.1rem;-webkit-appearance:none}
.input:focus{border-color:var(--gold)}
.btn{width:100%;background:var(--gold);border:none;color:#0B1629;padding:0.9rem;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all 0.2s;min-height:48px}
.btn:hover{background:var(--gold2)}
.error{background:rgba(255,91,91,0.1);border:1px solid rgba(255,91,91,0.25);border-radius:7px;padding:0.6rem 0.9rem;margin-bottom:1rem;color:#FF8A8A;font-size:0.8rem;display:none}
.error.show{display:block}
.back{display:block;text-align:center;margin-top:1.5rem;color:var(--text-muted);font-size:0.8rem;text-decoration:none}
.back:hover{color:var(--gold)}
@media(max-width:480px){
  .box{padding:2rem 1.25rem;border-radius:16px}
}
</style>
</head>
<body>

<div class="box">
  <a href="/" class="logo">Trade<span>Nex</span></a>
  <div class="subtitle">NOVA Trading Platform</div>

  <div class="error" id="loginError">ID atau kata laluan tidak sah.</div>

  <label class="label" for="novaId">NOVA ID</label>
  <input class="input" type="text" id="novaId" placeholder="Masukkan NOVA ID anda" autocomplete="username">

  <label class="label" for="novaPw">Kata Laluan</label>
  <input class="input" type="password" id="novaPw" placeholder="Masukkan kata laluan" autocomplete="current-password">

  <button class="btn" onclick="handleLogin()">LOG MASUK</button>
  <a href="/" class="back">← Balik ke laman utama</a>
</div>

<script>
function handleLogin(){
  var id=document.getElementById('novaId').value.trim();
  var pw=document.getElementById('novaPw').value;
  var err=document.getElementById('loginError');
  if(!id||!pw){err.textContent='Sila isi NOVA ID dan kata laluan.';err.classList.add('show');return;}
  err.classList.remove('show');
  var btn=document.querySelector('.btn');
  btn.textContent='Sedang log masuk...';btn.disabled=true;

  fetch('/api/login',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('meta[name="csrf-token"]').getAttribute('content')},
    body:JSON.stringify({nova_id:id,password:pw})
  })
  .then(function(res){return res.json();})
  .then(function(data){
    btn.textContent='LOG MASUK';btn.disabled=false;
    if(data.ok){ window.location.href=data.redirect; }
    else { err.textContent=data.message||'ID atau kata laluan tidak sah.'; err.classList.add('show'); }
  })
  .catch(function(){
    btn.textContent='LOG MASUK';btn.disabled=false;
    err.textContent='Ralat sambungan. Sila cuba semula.';err.classList.add('show');
  });
}
document.addEventListener('keydown',function(e){ if(e.key==='Enter') handleLogin(); });
</script>
</body>
</html>
